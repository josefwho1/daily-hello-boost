<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile viewport with safe area support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Preconnect to critical origins for faster initial load -->
    <link rel="preconnect" href="https://ionrilzocengahkkgxdt.supabase.co" />
    <link rel="dns-prefetch" href="https://ionrilzocengahkkgxdt.supabase.co" />
    
    <!-- Preload LCP image for faster initial paint -->
    <link rel="preload" href="/remi-waving-4.webp" as="image" type="image/webp" fetchpriority="high" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/webp" sizes="32x32" href="/icons/favicon-32.webp" />
    <link rel="icon" type="image/webp" sizes="16x16" href="/icons/favicon-16.webp" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <title>One Hello - Build Confidence Through Connection</title>
    <meta name="description" content="One Hello - The social app that actually helps you socialise." />
    <meta name="author" content="One Hello" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#502a13" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="One Hello" />
    
    <!-- Disable phone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="One Hello - The social app that actually helps you socialise." />
    <meta property="og:description" content="One Hello - The social app that actually helps you socialise." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.onehello.io/" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <link rel="canonical" href="https://app.onehello.io/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@OneHelloApp" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Inline theme script to prevent flash of wrong theme -->
    <script>
      (function() {
        // Always apply dark mode
        document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#502a13');
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
